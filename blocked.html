<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт заблокирован - HubHelp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: left;
    }

    .icon {
      font-size: 72px;
      margin-bottom: 24px;
      color: #333;
    }

    h1 {
      color: #202124;
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 16px;
    }

    .domain {
      color: #202124;
      font-size: 16px;
      margin-bottom: 24px;
      word-break: break-all;
    }

    .description {
      color: #5f6368;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .error-code {
      color: #5f6368;
      font-size: 14px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #dadce0;
    }

    .hubhelp-branding {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #dadce0;
    }

    .hubhelp-branding p {
      color: #5f6368;
      font-size: 13px;
    }

    .hubhelp-logo {
      font-weight: 600;
      color: #1a73e8;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .actions {
      margin-top: 24px;
    }

    button {
      padding: 10px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #f8f9fa;
      color: #3c4043;
      border: 1px solid #dadce0;
    }

    button:hover {
      background-color: #f1f3f4;
      border-color: #d2e3fc;
    }

    @media (max-width: 480px) {
      .icon {
        font-size: 56px;
      }

      h1 {
        font-size: 20px;
      }

      .description {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⛔</div>
    <h1 id="pageTitle">Сайт заблокирован</h1>
    
    <div class="domain" id="blockedDomain">www.google.com</div>
    
    <p class="description">
      Эта страница была заблокирована расширением.<br><br>
      Отключите расширения.
    </p>

    <div class="actions">
      <button onclick="goBack()">Вернуться назад</button>
    </div>
    
    <div class="error-code">
      ERR_BLOCKED_BY_CLIENT
    </div>

    <div class="hubhelp-branding">
      <div class="hubhelp-logo">HubHelp</div>
      <p>Блокировка выполнена расширением HubHelp для вашей безопасности.</p>
    </div>
  </div>

  <script>
    // Получаем параметры из URL
    const urlParams = new URLSearchParams(window.location.search);
    const blockedUrl = urlParams.get('url');
    const domain = urlParams.get('domain');

    // Отображаем домен
    if (domain) {
      document.getElementById('blockedDomain').textContent = domain;
      document.title = domain + ' заблокирован - HubHelp';
    } else {
      document.getElementById('blockedDomain').textContent = 'Неизвестный домен';
    }

    // Функция возврата назад
    function goBack() {
      window.history.back();
    }

    // Обработка кнопки "Назад" браузера
    window.onpopstate = function() {
      // Разрешаем навигацию назад
    };
  </script>
</body>
</html>
